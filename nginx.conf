user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Performance Adjustments
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Universal Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================================
    # 1. BEAT STOREFRONT (smgpub.com & www.smgpub.com)
    # Serves the static HTML/CSS beat storefront directly from beatstore/
    # =========================================================================
    server {
        listen 80;
        server_name smgpub.com www.smgpub.com;

        root /usr/share/nginx/html/beatstore;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wav|mp3)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # =========================================================================
    # 2. BACKEND API & STRIPE WEBHOOKS (api.smgpub.com)
    # Proxies API traffic and webhook listeners to Node.js (Port 4000)
    # =========================================================================
    server {
        listen 80;
        server_name api.smgpub.com;

        # Max payload size for stem/MIDI uploads
        client_max_body_size 50M;

        location / {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;

            # Preserve Client Context & IP Address
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Essential for Stripe Webhook Raw Body Verification & WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }

    # =========================================================================
    # 3. PRODUCER WEB DASHBOARD (app.smgpub.com)
    # Proxies Next.js Producer Dashboard (Port 3000)
    # =========================================================================
    server {
        listen 80;
        server_name app.smgpub.com;

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js Hot Reload & WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

