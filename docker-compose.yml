version: '3.8'

services:
  # ==========================================
  # 1. Primary Relational Database (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: smgpub_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-smgpub_platform_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Node.js & Express API Engine
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smgpub_backend
    restart: always
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-smgpub_platform_db}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 3. Next.js Web Dashboard & Suite
  # ==========================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: smgpub_web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ==========================================
  # 4. Nginx Reverse Proxy & Beatstore Host
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: smgpub_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./beatstore:/usr/share/nginx/html/beatstore:ro
    depends_on:
      - web
      - backend

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  pgdata:
