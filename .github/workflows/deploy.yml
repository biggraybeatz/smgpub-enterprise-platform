name: SMGPUB Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker Images & Deploy Zero-Downtime
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for optimized layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Step 4: Build & Push Backend Container Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/smgpub-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/smgpub-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/smgpub-backend:buildcache,mode=max

      # Step 5: Build & Push Web Frontend Container Image
      - name: Build and Push Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/smgpub-web:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/smgpub-web:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/smgpub-web:buildcache,mode=max

      # Step 6: Execute Zero-Downtime Rolling Update on Production Server via SSH
      - name: Deploy to Cloud Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            # Navigate to deployment directory
            cd /var/www/smgpub-platform

            # Pull latest repository changes
            git pull origin main

            # Inject production environment secrets dynamically
            cat << 'EOF' > .env
            PORT=4000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            EOF

            # Pull updated container images from registry
            docker-compose pull

            # Zero-Downtime Deployment Strategy:
            # 1. Spin up new container alongside existing active containers
            docker-compose up -d --no-deps --scale backend=2 --no-recreate backend

            # 2. Re-route live traffic to the updated containers
            docker-compose up -d --no-deps backend web nginx

            # 3. Scale back backend container count to standard single instance
            docker-compose up -d --no-deps --scale backend=1 backend

            # Clean up old unused image layers to preserve disk space
            docker system prune -f

