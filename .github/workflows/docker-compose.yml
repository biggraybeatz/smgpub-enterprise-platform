version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smgpub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smgpub_platform_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smgpub_backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/smgpub_platform_db
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: smgpub_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./beatstore:/usr/share/nginx/html/beatstore:ro
    depends_on:
      - backend

volumes:
  pgdata:
